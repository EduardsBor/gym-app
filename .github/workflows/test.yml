# GC-163-04: reproducible test runs on Linux and Windows (read-only: no secrets, no deploy, no writes to the repo).
name: PR 145 candidate tests (temporary)
on:
  pull_request:
    branches: ['fix/timed-hold-rkc-progression']
    types: [opened]
permissions:
  contents: read
jobs:
  test:
    if: github.event.pull_request.head.ref == 'ci/timed-rkc-42cae91' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '42cae9188214a490e00e94acfc5b40ea046ed32a'
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Chrome path
        shell: bash
        run: |
          if [ -n "$CHROME_PATH" ]; then echo "CHROME_PATH=$CHROME_PATH"; fi
          node -e "console.log('chrome:', require('./test/fixtures/chrome-path.js').findChrome())"
      - name: node --test (no npm install needed — tests use only Node built-ins)
        shell: bash
        run: |
          set +e +o pipefail
          node --test --test-reporter=tap --test-reporter-destination=test-${{ matrix.os }}.tap test/*.test.js 2> stderr-${{ matrix.os }}.txt
          code=$?
          echo "::notice title=${{ matrix.os }} exit::node --test exit code $code"
          grep -vE '^\s*$' stderr-${{ matrix.os }}.txt | head -n 8 | while read -r l; do echo "::warning title=${{ matrix.os }} stderr::$l"; done
          exit $code
      - name: summary (public annotations — logs need a sign-in, annotations do not)
        if: always()
        shell: bash
        run: |
          set +e +o pipefail   # grep with no matches must not fail this report-only step
          f=test-${{ matrix.os }}.tap
          if [ ! -s "$f" ]; then echo "::error::no TAP output — node --test did not run"; exit 0; fi
          echo "::notice title=${{ matrix.os }} totals::$(tail -n 8 "$f" | tr '\n' ' ')"
          grep -E '^not ok' "$f" | head -n 20 | while read -r l; do echo "::error title=${{ matrix.os }}::$l"; done
          grep -nE '^\s+(error|message|code|failureType|expected|actual):' "$f" | head -n 30 | while read -r l; do echo "::warning title=${{ matrix.os }} detail::$l"; done
          exit 0
